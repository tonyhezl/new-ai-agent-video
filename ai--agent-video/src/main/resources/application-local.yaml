spring:
  # MySQL
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:${DEV_MYSQL_PORT:43306}}/${MYSQL_DATABASE:ai-agent-video}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:change-me}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:${DEV_REDIS_PORT:46379}}
      password: ${REDIS_PASSWORD:change-me}
      database: 0

  # Spring AI - DashScope
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:sk-placeholder}

  lifecycle:
    timeout-per-shutdown-phase: 5s

server:
  shutdown: immediate

fusion:
  agentscope:
    shutdown-timeout: 3s

# 视频合成并发数（默认按 CPU 核心数自动计算，取消注释可手动覆盖）
# app:
#   video-compose:
#     max-concurrent: 2

video:
  compose:
    # 本地未加入 PATH 时，可直接改成绝对路径，例如 C:/ffmpeg/bin/ffmpeg.exe
    ffmpeg-path: ${VIDEO_COMPOSE_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${VIDEO_COMPOSE_FFPROBE_PATH:ffprobe}

# 日志级别（本地开发调高）
logging:
  level:
    com.tonyhe.fusion: DEBUG
    org.springframework.ai: DEBUG
    # 需要关闭 SQL 日志时打开下面这行
    com.tonyhe.fusion.mapper: INFO
