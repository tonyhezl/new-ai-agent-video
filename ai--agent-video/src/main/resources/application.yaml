spring:
  application:
    name: ai-agent-video

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  profiles:
    active: local

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 18080
  # Honor Nginx X-Forwarded-* headers so HTTPS same-origin requests are not
  # misclassified as cross-origin HTTP requests by Spring's CORS filter.
  forward-headers-strategy: framework

# 应用配置
app:
  cors:
    # 生产环境通过 APP_CORS_ALLOWED_ORIGIN_PATTERNS 配置精确域名，多个值以逗号分隔。
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  storage:
    local-base-path: ${APP_STORAGE_LOCAL_BASE_PATH:./data/media}
  version-check:
    enabled: ${APP_VERSION_CHECK_ENABLED:false}
    releases-api-url: ${APP_VERSION_CHECK_RELEASES_API_URL:}
    releases-page-url: ${APP_VERSION_CHECK_RELEASES_PAGE_URL:}
    backend-image-repository: ${APP_VERSION_CHECK_BACKEND_IMAGE_REPOSITORY:}
    frontend-image-repository: ${APP_VERSION_CHECK_FRONTEND_IMAGE_REPOSITORY:}

video:
  compose:
    ffmpeg-path: ${VIDEO_COMPOSE_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${VIDEO_COMPOSE_FFPROBE_PATH:ffprobe}
